# Aider model settings for the local Ollama models.
# Custom tasks on real repos: each model gets the largest context it supports on this machine
# (qwen2.5-coder 7B/14B: 32k, their native maximum, the 14B already spills ~7% to RAM;
# qwen3.6 35B MoE: 64k, its KV cache is tiny and it stays at ~54% GPU).
# 32k was too small for the thinking 35B: a 25k-token prompt left no room to finish its answer.
# Loaded with --model-settings-file.
# num_ctx is fixed on purpose: aider otherwise resizes it per request, which makes Ollama reload the model.
# num_predict caps each answer: Ollama never stops a model stuck in a repetition loop otherwise
# (context shift keeps generating, observed 66k tokens from a small model).
# qwen3.6 gets more room because its thinking counts toward the cap.

- name: ollama_chat/qwen2.5-coder:7b
  edit_format: diff
  use_repo_map: true
  examples_as_sys_msg: true
  extra_params:
    num_ctx: 32768
    num_predict: 8192

- name: ollama_chat/qwen2.5-coder:14b
  edit_format: diff
  use_repo_map: true
  examples_as_sys_msg: true
  extra_params:
    num_ctx: 32768
    num_predict: 8192

- name: ollama_chat/qwen3.6:35b-a3b-coding
  edit_format: diff
  use_repo_map: true
  examples_as_sys_msg: true
  extra_params:
    num_ctx: 65536
    num_predict: 16384
